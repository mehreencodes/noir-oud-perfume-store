<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Core SEO -->
    <title>Noir Oud — A Scent Studio | Small-Batch Oud Perfumes</title>
    <meta
      name="description"
      content="Noir Oud is a Lahore-based scent studio crafting small-batch oud, amber, and rare floral fragrances. Aged a minimum of six weeks before every bottle leaves the studio."
    />
    <meta name="keywords" content="oud perfume, luxury fragrance Pakistan, Lahore perfume studio, niche perfume, amber oud, Noir Oud" />
    <meta name="author" content="Noir Oud Studio" />
    <meta name="theme-color" content="#0b0906" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-domain-here.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Noir Oud — A Scent Studio" />
    <meta
      property="og:description"
      content="Small-batch oud, amber, and rare floral fragrances, aged for a minimum of six weeks before every bottle leaves the studio."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://your-domain-here.com" />
    <meta property="og:site_name" content="Noir Oud" />
    <meta property="og:locale" content="en_PK" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noir Oud — A Scent Studio" />
    <meta
      name="twitter:description"
      content="Small-batch oud, amber, and rare floral fragrances, aged for a minimum of six weeks before every bottle leaves the studio."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Structured Data: tells Google this is a real local business,
         with real locations — needed for Maps / local search / rich
         results. Update the addresses, phone, and social URLs before
         launch. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Noir Oud",
        "description": "A Lahore-based scent studio crafting small-batch oud, amber, and rare floral fragrances.",
        "url": "https://your-domain-here.com",
        "logo": "https://your-domain-here.com/favicon.svg",
        "image": "https://your-domain-here.com/og-image.jpg",
        "priceRange": "Rs 7,000 - Rs 10,000",
        "founder": {
          "@type": "Organization",
          "name": "Noir Oud Studio"
        },
        "foundingDate": "2019",
        "email": "hello@noiroud.com",
        "sameAs": [
          "https://instagram.com/noiroud",
          "https://pinterest.com/noiroud"
        ],
        "location": [
          {
            "@type": "Place",
            "name": "Noir Oud — Lahore (Flagship Studio)",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "MM Alam Road",
              "addressLocality": "Lahore",
              "addressCountry": "PK"
            }
          },
          {
            "@type": "Place",
            "name": "Noir Oud — Karachi",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Zamzama Boulevard",
              "addressLocality": "Karachi",
              "addressCountry": "PK"
            }
          },
          {
            "@type": "Place",
            "name": "Noir Oud — Islamabad",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "F-7 Markaz",
              "addressLocality": "Islamabad",
              "addressCountry": "PK"
            }
          }
        ],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "11:00",
          "closes": "19:00"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
